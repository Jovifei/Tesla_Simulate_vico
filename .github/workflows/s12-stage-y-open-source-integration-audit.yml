name: S12 Stage Y Open-Source Integration Audit

on:
  push:
    branches:
      - agent/s12-stage-y-open-source-integration
      - agent/s12-stage-y-final-closure
      - agent/s12-stage-z-open-source-proof
      - agent/s12-stage-aa-acoustic-quality-closure
      - s12-stage-ad-closed-loop-calibration
    paths:
      - ".github/workflows/s12-stage-y-open-source-integration-audit.yml"
      - "tools/sound_sim/s12/**"
      - "tasks/reports/runtime/s12-stage-y/**"
      - "tasks/reports/runtime/s12-stage-aa/**"
      - "tasks/reports/runtime/s12-stage-ad/**"
      - "docs/research/engine-audio-ecosystem/**"
      - "docs/knowledge/obsidian/S12/Engine-Audio-Ecosystem/**"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: s12-stage-y-open-source-integration-audit
  cancel-in-progress: true

env:
  EVIDENCE_DIR: /tmp/s12-stage-y-open-source-integration

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact integration tip
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: dependencies
        run: >-
          python -m pip install --upgrade
          pip numpy scipy pytest pytest-json-report jsonschema matplotlib pyyaml
          pandas soundfile pyloudnorm mosqito==1.2.1

      - name: Initialize evidence directory
        if: always()
        shell: bash
        run: mkdir -p "${EVIDENCE_DIR}"

      - name: Restore and verify receipt-bound Stage-W logs
        id: historical_logs
        shell: bash
        run: |
          set -o pipefail
          python tools/sound_sim/s12/acoustic_identity_v015/scripts/restore_stage_w_historical_log_bytes.py --apply \
            2>&1 | tee "${EVIDENCE_DIR}/historical_logs.log"
          git diff --quiet -- tasks/reports/runtime/s12-stage-w/logs

      - name: Compile S12 acoustic package
        id: compileall
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q tools/sound_sim/s12/acoustic_identity_v015 \
            2>&1 | tee "${EVIDENCE_DIR}/compileall.log"

      - name: Source-layer focused contracts
        id: source_layers
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_reachability.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_harmonic_map.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_cycle_sync.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_transients.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_dp_chain.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_package.py \
            --junitxml="${EVIDENCE_DIR}/source_layers.xml" \
            2>&1 | tee "${EVIDENCE_DIR}/source_layers.log"

      - name: Stage-Z method absorption contracts
        id: stage_z
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_z_method_ablation.py \
            --junitxml="${EVIDENCE_DIR}/stage_z.xml" \
            2>&1 | tee "${EVIDENCE_DIR}/stage_z.log"

      - name: Stage-AA acoustic closure contracts
        id: stage_aa
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_aa_semantics.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_aa_energy_budget.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_aa_energy_ledger.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_aa_reference_contract.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_aa_root_cause.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_aa_candidates.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_aa_candidate_audit.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_aa_finalist_review.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_aa_dynamic_contract.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_aa_package_v3.py \
            --junitxml="${EVIDENCE_DIR}/stage_aa.xml" \
            2>&1 | tee "${EVIDENCE_DIR}/stage_aa.log"

      - name: Closed-loop and hybrid-tooling focused contracts
        id: closed_loop
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_x_selection.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_x_search.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ad_closed_loop.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_remediation.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_historical_log_integrity.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_hybrid_calibration.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_calibration_bundle.py \
            --junitxml="${EVIDENCE_DIR}/closed_loop.xml" \
            2>&1 | tee "${EVIDENCE_DIR}/closed_loop.log"

      - name: Stage V/W regression contracts touched by source layers
        id: stage_vw
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_w_bakeoff.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_w_bakeoff_validator.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_w_v27_pipeline.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_v_event_domain.py \
            --junitxml="${EVIDENCE_DIR}/stage_vw.xml" \
            2>&1 | tee "${EVIDENCE_DIR}/stage_vw.log"

      - name: Complete S12 Python regression
        id: full_s12
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings \
            tools/sound_sim/s12/tests \
            tools/sound_sim/s12/acoustic_identity_v015/tests \
            --junitxml="${EVIDENCE_DIR}/full_s12.xml" \
            2>&1 | tee "${EVIDENCE_DIR}/full_s12.log"

      - name: Track-P frozen-boundary guard
        id: track_p
        shell: bash
        run: |
          set -o pipefail
          python tools/sound_sim/s12/acoustic_identity_v015/scripts/assert_track_p_unchanged.py \
            2>&1 | tee "${EVIDENCE_DIR}/track_p.log"

      - name: Repository, JSON, and license-boundary checks
        id: repository_checks
        shell: bash
        run: |
          set -o pipefail
          BASE="$(git merge-base HEAD origin/main)"
          git diff --check "${BASE}..HEAD" \
            2>&1 | tee "${EVIDENCE_DIR}/diff_check.log"
          python - <<'PY' 2>&1 | tee "${EVIDENCE_DIR}/registry_check.log"
          import json
          import hashlib
          import subprocess
          from pathlib import Path

          registry = Path("docs/research/engine-audio-ecosystem/source_registry.json")
          payload = json.loads(registry.read_text(encoding="utf-8"))
          assert isinstance(payload, dict)
          text = registry.read_text(encoding="utf-8").lower()
          for marker in ("engine-sim", "ignis", "markeasting", "license"):
              assert marker in text, marker
          matrix = json.loads(Path("docs/research/engine-audio-ecosystem/source_coverage_matrix.json").read_text(encoding="utf-8"))
          registry_ids = {entry["id"] for entry in payload["sources"]}
          matrix_entries = matrix["entries"]
          matrix_ids = {entry["id"] for entry in matrix_entries}
          assert len(matrix_entries) == len(matrix_ids)
          assert matrix_ids == registry_ids
          assert all(entry["coverage"] in matrix["status_values"] for entry in matrix_entries)
          receipts = json.loads(Path("docs/research/engine-audio-ecosystem/source_evidence_receipts.json").read_text(encoding="utf-8"))
          assert {entry["id"] for entry in receipts["receipts"]} == registry_ids
          receipt_path = Path("tasks/reports/runtime/s12-stage-y/final_qualification/y1_final_fitted_map_reachability_receipt_v2.json")
          artifact_path = Path("tasks/reports/runtime/s12-stage-y/y1_reachability/final_fitted_map_canonical/parameter_reachability.json")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          artifact = json.loads(artifact_path.read_text(encoding="utf-8"))
          assert receipt["exit_code"] == 0
          assert hashlib.sha256(artifact_path.read_bytes()).hexdigest() == receipt["artifact_sha256"]
          map_info = receipt["map"]
          map_path = Path(map_info["path"])
          assert map_info["sha256"].lower() == hashlib.sha256(map_path.read_bytes()).hexdigest()
          map_payload = json.loads(map_path.read_text(encoding="utf-8"))
          assert map_info["fixture_sha256"] == map_payload["fixture_sha256"]
          assert artifact["architecture"] == "P3"
          assert artifact["parameter_count"] == artifact["reachable_count"] == 16
          full_receipt = json.loads(Path("tasks/reports/runtime/s12-stage-y/final_qualification/full_s12_final_receipt_v2.json").read_text(encoding="utf-8"))
          assert full_receipt["exit_code"] == 0
          assert full_receipt["tested_head"] == subprocess.check_output(["git", "rev-parse", full_receipt["tested_head"]], text=True).strip()
          assert subprocess.run(["git", "merge-base", "--is-ancestor", full_receipt["tested_head"], "HEAD"]).returncode == 0
          assert full_receipt["pytest_summary"] and "failed" not in full_receipt["pytest_summary"]
          stage_z_matrix = json.loads(Path("docs/research/engine-audio-ecosystem/method_adoption_matrix_v2.json").read_text(encoding="utf-8"))
          assert stage_z_matrix["schema"] == "s12.stage_z.method_adoption_matrix.v2"
          assert stage_z_matrix["rows"] and len({row["source_id"] for row in stage_z_matrix["rows"]}) == len(registry_ids)
          assert subprocess.run(["git", "merge-base", "--is-ancestor", stage_z_matrix["main_head"], "HEAD"]).returncode == 0
          stage_z_scorecard = json.loads(Path("tasks/reports/runtime/s12-stage-z/method_ablation_scorecard.json").read_text(encoding="utf-8"))
          assert len(stage_z_scorecard["rows"]) >= 12
          assert stage_z_scorecard["executable_count"] >= 12
          stage_aa_scorecard = json.loads(Path("tasks/reports/runtime/s12-stage-aa/method_ablation_scorecard_v2.json").read_text(encoding="utf-8"))
          assert stage_aa_scorecard["executable_count"] >= 12
          print("registry and historical receipts: PASS")
          PY

      - name: Generate integration audit receipt
        id: receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["EVIDENCE_DIR"]) / "integration_audit_receipt.json"
          steps = {
              "compileall": "${{ steps.compileall.outcome }}",
              "source_layers": "${{ steps.source_layers.outcome }}",
              "stage_z": "${{ steps.stage_z.outcome }}",
              "stage_aa": "${{ steps.stage_aa.outcome }}",
              "closed_loop": "${{ steps.closed_loop.outcome }}",
              "stage_vw": "${{ steps.stage_vw.outcome }}",
              "full_s12": "${{ steps.full_s12.outcome }}",
              "track_p": "${{ steps.track_p.outcome }}",
              "repository_checks": "${{ steps.repository_checks.outcome }}",
          }
          payload = {
              "schema": "s12.stage_y.integration_audit.v1",
              "repository": "${{ github.repository }}",
              "event_name": "${{ github.event_name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "steps": steps,
              "passed": all(value == "success" for value in steps.values()),
          }
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Record exact audit identity
        id: identity
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          output = Path(os.environ["EVIDENCE_DIR"]) / "audit_identity.json"
          payload = {
              "schema": "s12.stage_y.audit_identity.v1",
              "repository": "${{ github.repository }}",
              "event_name": "${{ github.event_name }}",
              "ref": "${{ github.ref }}",
              "github_sha": "${{ github.sha }}",
              "checked_out_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "main_merge_base": subprocess.check_output(["git", "merge-base", "HEAD", "origin/main"], text=True).strip(),
          }
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s12-stage-y-open-source-integration-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error

      - name: Enforce audit result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads((Path(os.environ["EVIDENCE_DIR"]) / "integration_audit_receipt.json").read_text(encoding="utf-8"))
          if not receipt["passed"]:
              raise SystemExit(f"S12 integration audit failed: {receipt['steps']}")
          print("S12 integration audit: PASS")
          PY
