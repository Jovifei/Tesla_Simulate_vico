name: Vico N2 Qualification Tools

on:
  # No base-branch restriction: PR37 targets an audit branch rather than main.
  pull_request:
    paths:
      - '.github/workflows/vico-n2-qualification.yml'
      - '.gitattributes'
      - 'docs/.gitattributes'
      - 'docs/vico*n2*.md'
      - 'vico_app/tools/python/**'
      - 'vico_app/tools/jvm/**'
      - 'vico_app/tools/js/**'
      - 'vico_app/Project/android/app/src/main/assets/**'
      - 'vico_app/Project/android/app/src/main/java/com/vico/simulator/web/**'
      - 'vico_app/Project/android/app/src/main/java/com/vico/simulator/MainActivity.kt'
      - 'vico_app/Project/android/app/src/main/java/com/vico/simulator/sensor/**'
      - 'vico_app/Project/android/app/src/main/java/com/vico/simulator/csv/**'
      - 'vico_app/Project/android/app/src/test/java/com/vico/simulator/sensor/**'
      - 'vico_app/Project/android/app/src/main/java/com/vico/simulator/sound/**'
      - 'vico_app/Project/android/app/src/test/java/com/vico/simulator/sound/**'
  push:
    branches:
      - main
      - 'p2-n2-*'
      - 'codex-remote-p2-p3-*'
    paths:
      - '.github/workflows/vico-n2-qualification.yml'
      - '.gitattributes'
      - 'docs/.gitattributes'
      - 'docs/vico*n2*.md'
      - 'vico_app/tools/python/**'
      - 'vico_app/tools/jvm/**'
      - 'vico_app/tools/js/**'
      - 'vico_app/Project/android/app/src/main/assets/**'
      - 'vico_app/Project/android/app/src/main/java/com/vico/simulator/web/**'
      - 'vico_app/Project/android/app/src/main/java/com/vico/simulator/MainActivity.kt'
      - 'vico_app/Project/android/app/src/main/java/com/vico/simulator/sensor/**'
      - 'vico_app/Project/android/app/src/main/java/com/vico/simulator/csv/**'
      - 'vico_app/Project/android/app/src/test/java/com/vico/simulator/sensor/**'
      - 'vico_app/Project/android/app/src/main/java/com/vico/simulator/sound/**'
      - 'vico_app/Project/android/app/src/test/java/com/vico/simulator/sound/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vico-n2-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  linux-synthetic-export:
    name: Linux JVM exports and Python metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned binary numeric test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple
          --only-binary=:all: --require-hashes --force-reinstall
          -r vico_app/tools/python/requirements-n2-ci-linux.txt
      - name: Compile real Kotlin, export both partitions, and test actual PCM metrics
        run: >-
          python vico_app/tools/python/run_n2_ci.py
          --platform linux --download-deps
          --output "${{ runner.temp }}/vico-n2-linux"
      - name: Test calibration UI acknowledgement and lifecycle
        run: node --test vico_app/tools/js/test_calibration_ui.cjs vico_app/tools/js/test_input_quality_ui.cjs
      - name: Test sensor freshness, ordering, and Android source wiring
        run: |
          python vico_app/tools/python/run_sensor_jvm_tests.py --deps "${{ runner.temp }}/vico-n2-linux/deps" --build-dir "${{ runner.temp }}/vico-sensor-jvm"
          python -m unittest discover -s vico_app/tools/python -p 'test_sensor_input_wiring.py' -v
          python -m unittest discover -s vico_app/tools/python -p 'test_input_diagnostics_wiring.py' -v
          python -m unittest discover -s vico_app/tools/python -p 'test_input_quality_wiring.py' -v
      - name: Compile Python and check whitespace
        run: |
          python -m compileall -q vico_app/tools/python
          git diff --check

  windows-native-locks:
    name: Windows native msvcrt locks and gate CLI
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The gate suite creates its frozen binary fixture with this JDK. No Kotlin,
      # Android, pip packages, private clips, secrets, or deployment are used here.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Run real Windows process contention, budgets, sealing, and both CLIs
        run: >-
          python vico_app/tools/python/run_n2_ci.py
          --platform windows
          --output "${{ runner.temp }}/vico-n2-windows"
      - name: Compile gate tools and check whitespace
        run: |
          python -m py_compile vico_app/tools/python/n2_artifact_gate.py vico_app/tools/python/n2_hard_gate.py vico_app/tools/python/run_n2_ci.py
          git diff --check

  android-input-build:
    name: Android input compile, unit tests, lint and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact checkout and preinstalled Android SDK only
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          : "${ANDROID_HOME:?Hosted runner must provide an existing Android SDK}"
          for path in platforms/android-34/android.jar build-tools/34.0.0/aapt build-tools/34.0.0/aapt2 build-tools/34.0.0/zipalign licenses/android-sdk-license; do
            test -s "$ANDROID_HOME/$path" || { echo "Required preinstalled SDK file missing: $path; no SDK download or license acceptance is permitted"; exit 1; }
          done
          echo "checked_out_head=$EXPECTED_HEAD"
          cat "$ANDROID_HOME/platforms/android-34/source.properties"
          cat "$ANDROID_HOME/build-tools/34.0.0/source.properties"
          git ls-files -z vico_app/Project/android | xargs -0 sha256sum
      - name: Compile Android adapters and run input gates
        id: build
        working-directory: vico_app/Project/android
        run: >-
          bash gradlew --no-daemon --continue -Pandroid.builder.sdkDownload=false
          :app:compileDebugKotlin :app:compileDebugUnitTestKotlin
          :app:testDebugUnitTest --tests 'com.vico.simulator.sensor.*'
          --tests 'com.vico.simulator.sound.AudioInputGateTest'
          --tests 'com.vico.simulator.sound.MatlabTransientClearTest'
          --tests 'com.vico.simulator.sound.MatlabPowertrainControllerTest'
          :app:lintDebug :app:assembleDebug
      - name: Record test scope and generated APK identity
        if: ${{ always() && steps.sdk.outcome == 'success' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('vico_app/Project/android/app/build')
          reports = sorted((root / 'test-results/testDebugUnitTest').glob('TEST-com.vico.simulator.*.xml'))
          totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          print(json.dumps({'scope': 'Android JVM input and live powertrain/audio gates, not device/GNSS acceptance', 'reports': len(reports), **totals}))
          lint = root / 'reports/lint-results-debug.xml'
          if not lint.is_file():
              raise SystemExit('Android lint XML report missing: NOT_RUN_OR_UNAVAILABLE')
          issues = ET.parse(lint).getroot().findall('issue')
          lint_errors = [issue for issue in issues if issue.get('severity') in ('Fatal', 'Error')]
          print(json.dumps({'lint_issues': len(issues), 'lint_errors': len(lint_errors), 'lint_warnings': sum(issue.get('severity') == 'Warning' for issue in issues)}))
          for issue in issues:
              print('LINT', issue.get('severity'), issue.get('id'), issue.get('message'))
          if lint_errors:
              raise SystemExit('Android lint reported errors')
          if not reports or totals['tests'] < 21 or any(totals[key] for key in ('failures', 'errors', 'skipped')):
              raise SystemExit('Sensor gate incomplete, failed, or skipped')
          PY
          APK=vico_app/Project/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
          stat --format='apk_bytes=%s' "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK"
          echo "DEVICE_GNSS_ACCURACY_AND_HUMAN_ACCEPTANCE=NOT_RUN"
