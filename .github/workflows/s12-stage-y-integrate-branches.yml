name: S12 Stage Y Integrate Branches

on:
  push:
    branches:
      - agent/s12-stage-y-open-source-integration
    paths:
      - ".github/workflows/s12-stage-y-integrate-branches.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge closed-loop branch with explicit conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SOURCE_LAYER_HEAD="4ac95c0100b3fde116de26f99959b585fc6987b7"
          CLOSED_LOOP_HEAD="8589b5575e391e75accc7c759049d28bfa22b9ae"
          git fetch origin agent/s12-stage-y-closed-loop-remediation
          test "$(git rev-parse origin/agent/s12-stage-y-closed-loop-remediation)" = "${CLOSED_LOOP_HEAD}"

          set +e
          git merge --no-commit --no-ff "${CLOSED_LOOP_HEAD}"
          MERGE_RC=$?
          set -e
          test "${MERGE_RC}" -eq 1

          CONFLICTS="$(git diff --name-only --diff-filter=U | sort)"
          EXPECTED=$'tasks/reports/runtime/s12-stage-x/EXECUTION_RESUME.md\ntools/sound_sim/s12/acoustic_identity_v015/stage_y/__init__.py'
          test "${CONFLICTS}" = "${EXPECTED}"

          git checkout --ours -- tasks/reports/runtime/s12-stage-x/EXECUTION_RESUME.md
          git add tasks/reports/runtime/s12-stage-x/EXECUTION_RESUME.md

          cat > tools/sound_sim/s12/acoustic_identity_v015/stage_y/__init__.py <<'PY'
          """Stage Y source-layer, calibration, and hybrid-source utilities.

          The package combines clean-room synthetic source layers with rights-gated
          calibration tooling. It does not embed third-party audio and does not
          modify frozen PTR/FVM/Radiation mathematics.
          """

          from .cycle_residual_bank import CycleResidualBank, CycleResidualRecord
          from .harmonic_map_fit import load_committed_fixture_timbre_map
          from .harmonic_timbre_extractor import (
              HarmonicTimbreMap,
              extract_harmonic_timbre_map,
          )
          from .transfer_response_id import FirIdentificationResult, identify_fir_response

          __all__ = [
              "CycleResidualBank",
              "CycleResidualRecord",
              "FirIdentificationResult",
              "HarmonicTimbreMap",
              "extract_harmonic_timbre_map",
              "identify_fir_response",
              "load_committed_fixture_timbre_map",
          ]
          PY
          git add tools/sound_sim/s12/acoustic_identity_v015/stage_y/__init__.py

          git rm -f .github/workflows/s12-stage-y-final-validation-v3.yml

          python tools/sound_sim/s12/acoustic_identity_v015/scripts/restore_stage_w_historical_log_bytes.py --apply
          git add tasks/reports/runtime/s12-stage-w/logs

          cat > docs/08-reports/06-s12-stage-y-open-source-integration.md <<EOF
          # S12 Stage Y Open-Source Method Integration

          Status: \`INTEGRATED_ON_DEDICATED_BRANCH / FINAL_FITTED_MAP_NOT_QUALIFIED / MAIN_NOT_UPDATED\`

          Integration branch: \`agent/s12-stage-y-open-source-integration\`

          Inputs:

          - source-layer checkpoint: \`${SOURCE_LAYER_HEAD}\`;
          - closed-loop remediation: \`${CLOSED_LOOP_HEAD}\`;
          - common design ancestry: \`f1714b969ecd033e991e04cfc59df06a05e3685a\`.

          The integration retains both clean-room method families:

          1. persistent event-domain source, fitted harmonic map, cycle-synchronous P4,
             state transients, and persistent DC/dP/delay processing;
          2. reference governance, corrected comparator, fail-closed engineering gates,
             bounded human-feedback objective, rights-gated residual/timbre extraction,
             transfer-response identification, and finalist validation.

          No external source code, presets, copyrighted vehicle audio, IR assets, or
          commercial model data are added. Track-P remains frozen.

          This merge is not a final qualification. The committed fitted-map broadband
          control remains below the bilateral 0.02 reachability threshold, and the
          final-map boost/bypass evidence is not closed. The historical closed-loop CI
          receipt remains branch-specific evidence and is not acceptance of this
          combined tree. The combined tree must pass its own integration workflow
          before it may be proposed to main.
          EOF
          git add -f docs/08-reports/06-s12-stage-y-open-source-integration.md

          git rm .github/workflows/s12-stage-y-integrate-branches.yml

          python -m compileall -q tools/sound_sim/s12/acoustic_identity_v015
          git diff --check --cached
          test -z "$(git diff --name-only --diff-filter=U)"

          git commit -m "merge(s12): integrate source layers and closed-loop calibration"
          git push origin HEAD:agent/s12-stage-y-open-source-integration
