name: S12 Stage Y Merge Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - agent/s12-stage-y-open-source-integration
    paths:
      - ".github/workflows/s12-stage-y-merge-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attempt no-commit merge and report conflicts
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/s12-stage-y-closed-loop-remediation
          git merge --no-commit --no-ff origin/agent/s12-stage-y-closed-loop-remediation
          MERGE_RC=$?
          echo "merge_rc=${MERGE_RC}"
          echo "conflicts_begin"
          git diff --name-only --diff-filter=U | sort
          echo "conflicts_end"
          echo "status_begin"
          git status --short
          echo "status_end"
          git merge --abort || true
          exit 0
