name: S12 Stage Y Final Validation

on:
  push:
    branches:
      - agent/s12-stage-y-closed-loop-remediation
    paths:
      - ".github/workflows/s12-stage-y-final-validation.yml"
      - "tools/sound_sim/s12/**"
      - "tasks/reports/runtime/s12-stage-w/logs/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: s12-stage-y-final-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch tip
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: >-
          python -m pip install --upgrade
          pip numpy scipy pytest pytest-json-report jsonschema matplotlib pyyaml
          pandas soundfile pyloudnorm mosqito==1.2.1

      - name: Verify receipt-bound Stage-W logs
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .stage_y_ci
          python tools/sound_sim/s12/acoustic_identity_v015/scripts/restore_stage_w_historical_log_bytes.py --apply \
            2>&1 | tee .stage_y_ci/historical_log_check.log
          if ! git diff --quiet -- tasks/reports/runtime/s12-stage-w/logs; then
            echo "Historical Stage-W logs did not match their W9 receipt at checked-out HEAD." >&2
            git diff --stat -- tasks/reports/runtime/s12-stage-w/logs
            exit 21
          fi

      - name: Compile S12 package
        run: python -m compileall -q tools/sound_sim/s12/acoustic_identity_v015

      - name: Run Stage X/Y focused contracts
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_x_selection.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_x_search.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_remediation.py \
            tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_historical_log_integrity.py \
            --junitxml=.stage_y_ci/focused.xml \
            2>&1 | tee .stage_y_ci/focused.log

      - name: Run complete S12 Python regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings \
            tools/sound_sim/s12/tests \
            tools/sound_sim/s12/acoustic_identity_v015/tests \
            --junitxml=.stage_y_ci/full.xml \
            2>&1 | tee .stage_y_ci/full.log

      - name: Verify Track-P remains unchanged
        shell: bash
        run: |
          set -o pipefail
          python tools/sound_sim/s12/acoustic_identity_v015/scripts/assert_track_p_unchanged.py \
            2>&1 | tee .stage_y_ci/track_p.log

      - name: Generate authoritative CI receipt
        shell: bash
        env:
          TESTED_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('.stage_y_ci')
          def counts(path: Path) -> dict[str, int]:
              node = ET.parse(path).getroot()
              suites = [node] if node.tag == 'testsuite' else list(node.findall('testsuite'))
              return {
                  'tests': sum(int(float(s.get('tests', '0'))) for s in suites),
                  'failures': sum(int(float(s.get('failures', '0'))) for s in suites),
                  'errors': sum(int(float(s.get('errors', '0'))) for s in suites),
                  'skipped': sum(int(float(s.get('skipped', '0'))) for s in suites),
              }
          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          focused = counts(root / 'focused.xml')
          full = counts(root / 'full.xml')
          payload = {
              'schema': 's12.stage_y.ci_acceptance.v1',
              'status': 'PASS',
              'tested_head': os.environ['TESTED_HEAD'],
              'workflow_run_id': int(os.environ['RUN_ID']),
              'workflow_run_attempt': int(os.environ['RUN_ATTEMPT']),
              'completed_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              'python': '3.12',
              'focused': focused,
              'full_s12': full,
              'compileall_exit_code': 0,
              'track_p_exit_code': 0,
              'historical_log_integrity': 'PASS',
              'log_sha256': {
                  'historical_log_check': sha(root / 'historical_log_check.log'),
                  'focused': sha(root / 'focused.log'),
                  'full': sha(root / 'full.log'),
                  'track_p': sha(root / 'track_p.log'),
              },
              'qualification_boundary': {
                  'real_r1_reference': 'MISSING',
                  'human_audition': 'PENDING',
                  'profile_freeze': False,
                  'oem_match_claim': False,
              },
              'scope': 'software feedback-loop validation; synthetic; uncalibrated; not OEM reproduction',
          }
          assert focused['failures'] == focused['errors'] == 0
          assert full['failures'] == full['errors'] == 0
          out = Path('tasks/reports/runtime/s12-stage-y/stage_y_ci_acceptance_receipt.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Commit CI receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasks/reports/runtime/s12-stage-y/stage_y_ci_acceptance_receipt.json
          if git diff --cached --quiet; then
            echo "CI receipt already current"
          else
            git commit -m "test(s12): record Stage Y final validation"
            git push origin HEAD:agent/s12-stage-y-closed-loop-remediation
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s12-stage-y-final-validation-${{ github.sha }}
          path: .stage_y_ci/
          if-no-files-found: warn
          retention-days: 30
