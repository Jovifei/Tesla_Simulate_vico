name: Vico Web isolated port
on:
  push:
    branches: ['codex-web-vico-lab-20261015']
    paths: ['vico_web/**', '.github/workflows/vico-web.yml']
  pull_request:
    paths: ['vico_web/**', '.github/workflows/vico-web.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vico-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Run meaningful unit and actual processor-entry tests
        run: node --test vico_web/test/*.test.mjs
      - name: Build six real banks from exact parent Git objects
        run: node vico_web/tools/build.mjs --out "${{ runner.temp }}/vico-web-dist"
      - name: Record real build scope
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const p=process.env.RUNNER_TEMP+"/vico-web-dist/catalog.json";
          const c=JSON.parse(fs.readFileSync(p));
          if(c.testOnly || c.vehicles.length!==6)throw Error("Not a real six-bank build");
          console.log(JSON.stringify({sourceCommit:c.sourceCommit,webCommit:c.webCommit,vehicles:6,kotlinParity:"NOT_RUN",browser:"NOT_RUN",device:"NOT_RUN",acoustic:"NOT_EVALUATED"}));'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vico-web-static-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/vico-web-dist
          if-no-files-found: error
          retention-days: 14
