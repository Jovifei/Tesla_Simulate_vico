name: S12 Stage AH Source Remediation
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/sound_sim/s12/acoustic_identity_v015/stage_ah/**'
      - 'tools/sound_sim/s12/acoustic_identity_v015/stage_ad/engine_sim_acoustics.py'
      - 'tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ah*'
      - '.github/workflows/s12-stage-ah-source-remediation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact checked-out source
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_ID: ${{ github.job }}
        run: >-
          python -c "import os,subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); expected=os.environ['EXPECTED_PR_HEAD']; print('run_id='+os.environ['RUN_ID']); print('run_attempt='+os.environ['RUN_ATTEMPT']); print('job_id='+os.environ['JOB_ID']); print('checked_out_head='+actual); print('expected_pr_head='+expected); assert actual==expected"
      - name: Install numeric test dependencies
        run: python -m pip install numpy scipy pytest
      - name: AH source and full package integration
        run: python -m pytest -q tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ah_output_guard.py tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ah_sources.py tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ah_integration.py tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ah_fourcar_real_reference.py tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ah_fourcar_audit_fixes.py
      - name: Preserve AG-R1 and strict review
        run: python -m pytest -q tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ag_r1_reference_remediation.py tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ag_r1_review_server.py
      - name: Compile and whitespace
        run: |
          python -m compileall -q tools/sound_sim/s12/acoustic_identity_v015/stage_ah
          git diff --check
