name: S12 Stage Y Cross-Platform Test Fix

on:
  push:
    branches:
      - agent/s12-stage-y-open-source-integration
    paths:
      - ".github/workflows/s12-stage-y-cross-platform-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace exact float equality without changing the 0.02 gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_reachability.py")
          text = path.read_text(encoding="utf-8")
          old = "    assert gained_share == target_share\n"
          new = (
              "    assert np.isclose(\n"
              "        gained_share, target_share, rtol=1.0e-12, atol=1.0e-15\n"
              "    )\n"
          )
          assert text.count(old) == 1, "expected strict equality was not found exactly once"
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY

          git rm .github/workflows/s12-stage-y-cross-platform-fix.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_y_reachability.py
          git commit -m "test(s12): make gain invariance comparison cross-platform"
          git push origin HEAD:agent/s12-stage-y-open-source-integration
