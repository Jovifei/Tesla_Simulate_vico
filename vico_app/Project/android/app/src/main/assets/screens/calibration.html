<style>
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    @keyframes pulse-soft {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.02); opacity: 0.9; }
    }
    .animate-pulse-soft {
        animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes ring-expand {
        0% { transform: scale(0.5); opacity: 0; }
        50% { opacity: 0.3; }
        100% { transform: scale(1.5); opacity: 0; }
    }
    .ring-anim {
        animation: ring-expand 3s infinite linear;
    }
    .ring-anim-delayed {
        animation: ring-expand 3s infinite linear 1.5s;
    }
</style>

    }

<script>document.documentElement.classList.add('vico-page-loading');</script>

</head>
<body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full fixed top-0 z-50 bg-surface border-b border-surface-variant">
<div class="flex items-center">
<span class="material-symbols-outlined text-primary cursor-pointer active:scale-95 transition-transform hover:opacity-80">graphic_eq</span>
</div>
<h1 class="font-headline-md text-headline-md tracking-tighter text-primary">VICO 校准</h1>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary cursor-pointer active:scale-95 transition-transform hover:opacity-80">sensors</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center pt-[80px] pb-margin-desktop px-margin-mobile w-full max-w-4xl mx-auto gap-lg">
<!-- Onboarding Flow -->
<div class="w-full max-w-md bg-surface border border-surface-variant rounded-xl p-md shadow-sm">
<div class="grid grid-cols-3 gap-sm relative">
<!-- Connectors -->
<div class="absolute top-4 left-[16%] right-[16%] h-[1px] bg-surface-variant z-0"></div>
<!-- Step 1 -->
<div class="flex flex-col items-center gap-xs z-10">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary text-[12px] font-bold">1</div>
<span class="text-label-md font-medium text-on-surface">固定手机</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-xs z-10">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary text-[12px] font-bold">2</div>
<span class="text-label-md font-medium text-on-surface">车辆静止</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-xs z-10">
<div class="w-8 h-8 rounded-full bg-surface-container-highest border border-surface-variant flex items-center justify-center text-on-surface-variant text-[12px] font-bold" id="step-3-circle">3</div>
<span class="text-label-md font-medium text-on-surface-variant" id="step-3-label">点击归零</span>
</div>
</div>
</div>
<!-- Status Message -->
<div class="flex items-center gap-sm p-sm bg-surface-container border border-surface-variant rounded w-full max-w-md">
<span class="material-symbols-outlined text-primary">info</span>
<span class="font-body-md text-body-md text-on-surface">校准期间车辆必须保持完全静止，且手机已稳固安置。</span>
</div>
<!-- 3D Bubble Level / Axis Indicator -->
<div class="relative w-64 h-64 md:w-80 md:h-80 bg-surface border border-surface-variant rounded-xl flex items-center justify-center overflow-hidden shadow-inner">
<!-- Grid Lines -->
<div class="absolute inset-0 bg-[linear-gradient(to_right,#e2e2e2_1px,transparent_1px),linear-gradient(to_bottom,#e2e2e2_1px,transparent_1px)] bg-[size:16px_16px] opacity-40"></div>
<!-- Animated Concentric Rings -->
<div class="absolute w-24 h-24 border border-primary rounded-full ring-anim opacity-0"></div>
<div class="absolute w-24 h-24 border border-primary rounded-full ring-anim-delayed opacity-0"></div>
<!-- Static Target Rings -->
<div class="absolute w-[80%] h-[80%] border border-surface-variant rounded-full opacity-30"></div>
<div class="absolute w-[40%] h-[40%] border border-surface-variant rounded-full opacity-30"></div>
<!-- Crosshairs -->
<div class="absolute w-full h-[1px] bg-surface-variant opacity-50"></div>
<div class="absolute w-[1px] h-full bg-surface-variant opacity-50"></div>
<!-- Center Origin -->
<div class="absolute w-2.5 h-2.5 bg-outline rounded-full z-10"></div>
<!-- The 'Bubble' -->
<div class="absolute w-7 h-7 bg-primary rounded-full shadow-[0_0_15px_rgba(0,88,188,0.5)] transition-all duration-75 ease-out z-20 flex items-center justify-center" id="calibration-bubble" style="transform: translate(15.4566px, -20.1276px);">
<div class="w-2 h-2 bg-white rounded-full opacity-30"></div>
</div>
</div>
<!-- Accelerometer Data Readout -->
<div class="grid grid-cols-3 gap-sm w-full max-w-md">
<!-- X Axis -->
<div class="bg-surface border border-surface-variant rounded-lg p-sm flex flex-col items-center gap-base">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">当前偏置 X</span>
<span class="font-data-mono text-data-mono text-on-surface" id="data-x">+0.155 g</span>
</div>
<!-- Y Axis -->
<div class="bg-surface border border-surface-variant rounded-lg p-sm flex flex-col items-center gap-base">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">当前偏置 Y</span>
<span class="font-data-mono text-data-mono text-on-surface" id="data-y">-0.201 g</span>
</div>
<!-- Z Axis -->
<div class="bg-surface border border-surface-variant rounded-lg p-sm flex flex-col items-center gap-base bg-primary-container/10">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">当前偏置 Z</span>
<span class="font-data-mono text-data-mono text-primary" id="data-z">+0.983 g</span>
</div>
</div>
<!-- Primary Action -->
<div class="w-full max-w-md pt-md">
<button class="w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md rounded-xl hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm shadow-lg animate-pulse-soft" id="btn-zero">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">adjust</span>
                归零 (Reset)
            </button>
</div>
</main>
<script>
        // === 接收原生重力/加速度 (VicoBridge.__vicoUpdate) ===
        var bubble = document.getElementById('calibration-bubble');
        var dataX = document.getElementById('data-x');
        var dataY = document.getElementById('data-y');
        var dataZ = document.getElementById('data-z');
        var btnZero = document.getElementById('btn-zero');
        var step3Circle = document.getElementById('step-3-circle');
        var step3Label = document.getElementById('step-3-label');
        var isCalibrated = false;
        var G = 9.80665;
        var refGx = 0, refGy = 0, refGz = 0;        // 归零参考, 归零后偏置以此为基础
        var lastGx = 0, lastGy = 0, lastGz = 0;

        function fmt(v){ return (v>=0?'+':'') + v.toFixed(3) + ' g'; }
        function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

        window.__vicoUpdate = function(s){
          try {
            lastGx = s.gx||0; lastGy = s.gy||0; lastGz = s.gz||0; if(!window.__cn)window.__cn=0; if(++window.__cn%10===0)console.log('vcg',s.gx,s.gy,s.gz);
            // 显示相对归零参考的偏置 (归零后 = 0.000 g)
            if(dataX) dataX.textContent = fmt((lastGx - refGx) / G);
            if(dataY) dataY.textContent = fmt((lastGy - refGy) / G);
            if(dataZ) dataZ.textContent = fmt((lastGz - refGz) / G);
            if(bubble){
              var bx = clamp((lastGx - refGx) * 30, -110, 110);
              var by = clamp((lastGy - refGy) * 30, -110, 110);
              bubble.style.transform = 'translate(' + bx + 'px, ' + by + 'px)';
            }
            if(s.calibrated && !isCalibrated){
              isCalibrated = true;
              if(btnZero) btnZero.classList.remove('animate-pulse-soft');
            }
          } catch(e){ console.log('calib update err', e); }
        };

        // 归零: 记录当前重力为参考 (X/Y/Z 偏置归 0, 气泡居中) + 采样线性偏置 + 完成校准
        if(btnZero) btnZero.addEventListener('click', function(){
          var orig = btnZero.innerHTML;
          btnZero.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">progress_activity</span> 采样中…';
          console.log('vcz-click',lastGx,lastGy,lastGz); try { window.AndroidBridge.beginCalibration(); } catch(e){}
          setTimeout(function(){
            refGx = lastGx; refGy = lastGy; refGz = lastGz;   // 三轴偏置归零
            try { window.AndroidBridge.calibrateZero(); window.AndroidBridge.finishCalibration(); } catch(e){}
            isCalibrated = true;
            btnZero.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span> 校准完成';
            btnZero.classList.add('bg-green-600');
            btnZero.classList.remove('bg-primary','animate-pulse-soft');
            if(step3Circle){
              step3Circle.classList.remove('bg-surface-container-highest','text-on-surface-variant');
              step3Circle.classList.add('bg-primary','text-on-primary');
            }
            if(step3Label){
              step3Label.classList.remove('text-on-surface-variant');
              step3Label.classList.add('text-on-surface');
              step3Label.textContent = '校准完成';
            }
            setTimeout(function(){
              btnZero.innerHTML = orig;
              btnZero.classList.add('bg-primary');
              btnZero.classList.remove('bg-green-600');
            }, 2000);
          }, 800);
        });

        // 左上角 graphic_eq 返回仪表盘
        var backBtn = document.querySelector('header .material-symbols-outlined');
        if(backBtn) backBtn.addEventListener('click', function(){ try { window.AndroidBridge.navigate('dashboard'); } catch(e){} });</script>
<script src="file:///android_asset/bridge.js"></script></body></html>
