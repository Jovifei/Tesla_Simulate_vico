name: S12 Stage AI Measured Feedback
on:
  pull_request:
    paths:
      - 'tools/sound_sim/s12/acoustic_identity_v015/**'
      - '.github/workflows/s12-stage-ai-measured-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os,subprocess; h=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); print('checked_out_head='+h); assert h==os.environ['EXPECTED_HEAD']"
      - name: Install tests
        run: python -m pip install numpy scipy pytest
      - name: AI measured four-car loop and original three-way workbench
        run: python -m pytest -q tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ai_evidence.py tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ai_fourcar.py tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ai_threeway.py
      - name: Preserve prior reference feedback core and actual two-car pipeline
        run: python -m pytest -q tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ah_reference_feedback.py tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ah_reference_feedback_adapter.py tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ah_reference_feedback_package.py
      - name: RX-7 startup boundary true-peak repair
        run: python -m pytest -q tools/sound_sim/s12/acoustic_identity_v015/tests/test_s12_stage_ai4b_rx7_boundary_repair.py
      - name: Compile and frozen-path checks
        run: |
          python -m compileall -q tools/sound_sim/s12/acoustic_identity_v015/stage_ah
          python tools/sound_sim/s12/acoustic_identity_v015/scripts/assert_track_p_unchanged.py
          git diff --check
