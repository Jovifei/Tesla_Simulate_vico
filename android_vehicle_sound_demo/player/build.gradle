plugins {
    id "com.android.application"
}

android {
    namespace "com.jovi.s12player"
    compileSdk 35
    ndkVersion "30.0.16248370"

    defaultConfig {
        applicationId "com.jovi.s12player"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                        "-DAPP1_REPO_ROOT=${new File(projectDir, '../..').canonicalPath.replace('\\', '/')}"
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.oboe:oboe:1.11.0"
    testImplementation "junit:junit:4.13.2"
}
